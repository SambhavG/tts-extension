<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kokoro TTS Reader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img src="icons/icon-16.png" alt="LocalReader Logo" class="logo-icon">
        <h1>LocalReader</h1>
      </div>
      <span class="version-badge">v0.4.0</span>
    </header>

    <main>
      <div class="card settings-card">
        <div class="control-group">
          <label for="voice">Voice</label>
          <div class="select-wrapper">
            <select id="voice">
              <option value="">Loading voices...</option>
            </select>
          </div>
        </div>

        <div class="control-group">
          <label for="speed">Speed</label>
          <div class="select-wrapper">
            <select id="speed">
              <option value="0.25">0.25×</option>
              <option value="0.50">0.50×</option>
              <option value="0.75">0.75×</option>
              <option value="1.00" selected>1.00×</option>
              <option value="1.25">1.25×</option>
              <option value="1.50">1.50×</option>
              <option value="1.75">1.75×</option>
              <option value="2.00">2.00×</option>
              <option value="2.25">2.25×</option>
              <option value="2.50">2.50×</option>
              <option value="2.75">2.75×</option>
              <option value="3.00">3.00×</option>
              <option value="3.25">3.25×</option>
              <option value="3.50">3.50×</option>
              <option value="3.75">3.75×</option>
              <option value="4.00">4.00×</option>
            </select>
          </div>
        </div>

        <div class="control-group">
          <label for="max-chunk-length">Max read length <span id="max-chunk-value" class="range-value">350</span></label>
          <input type="range" id="max-chunk-length" min="50" max="350" step="10" value="350" />
        </div>

        <div class="control-group checkbox-group">
          <label for="click-to-read">Click to read</label>
          <label class="toggle-wrapper" for="click-to-read">
            <input type="checkbox" id="click-to-read" checked />
            <div class="toggle-track">
              <div class="toggle-thumb"></div>
            </div>
          </label>
        </div>

        <div class="control-group checkbox-group">
          <label for="auto-scroll">Auto-scroll</label>
          <label class="toggle-wrapper" for="auto-scroll">
            <input type="checkbox" id="auto-scroll" checked />
            <div class="toggle-track">
              <div class="toggle-thumb"></div>
            </div>
          </label>
        </div>

        <div class="control-group">
          <label for="highlight-color">Highlight Color</label>
          <input type="color" id="highlight-color" value="#22a594" />
        </div>
      </div>

      <div class="action-area">
        <button id="read-button" class="primary-button">
          <span class="btn-content">Read</span>
        </button>
        <button id="stop-button" class="stop-button" style="display: none;">
          Stop
        </button>
      </div>

      <div class="shortcuts-info">
        <div class="shortcut-item">
          <kbd>Click</kbd> <span>Read from here</span>
        </div>
        <div class="shortcut-item">
          <kbd>Alt+Shift+S</kbd> <span>Play / Pause</span>
        </div>
        <div class="shortcut-item">
          <kbd>Alt+Shift+X</kbd> <span>Stop</span>
          &nbsp;
          <kbd>Alt+J/K</kbd> <span>Nav</span>
        </div>
      </div>
    </main>

    <script src="popup.js" type="module"></script>
  </body>
</html>
